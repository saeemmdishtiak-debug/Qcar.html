<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RUSH DRIVE 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
#gameCanvas{display:block;width:100%;height:100%;position:absolute;top:0;left:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3a 50%,#0d1b2a 100%);color:#fff;transition:opacity .4s,visibility .4s}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
h1{font-size:clamp(2.2rem,8vw,3.8rem);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#00f5ff,#ff00aa,#ffea00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(0,245,255,0.5);margin-bottom:8px}
.subtitle{font-size:1rem;opacity:0.7;margin-bottom:32px;letter-spacing:4px;text-transform:uppercase}
.btn{display:block;width:min(280px,80vw);padding:16px 24px;margin:10px 0;font-size:1.15rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#00c6ff,#0072ff);border:none;border-radius:14px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 20px rgba(0,114,255,0.4);text-align:center;letter-spacing:1px}
.btn:hover,.btn:active{transform:scale(1.05);box-shadow:0 6px 28px rgba(0,114,255,0.6)}
.btn.secondary{background:linear-gradient(135deg,#434343,#000)}
.btn.danger{background:linear-gradient(135deg,#ff416c,#ff4b2b)}
.btn.success{background:linear-gradient(135deg,#11998e,#38ef7d)}
#hud{position:absolute;top:0;left:0;right:0;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;z-index:50;pointer-events:none;font-weight:700;text-shadow:0 2px 6px #000}
.hud-item{background:rgba(0,0,0,0.55);padding:8px 14px;border-radius:12px;font-size:0.95rem;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1)}
.hud-item span{color:#00f5ff}
#speedDisplay{font-size:1.4rem;color:#ffea00}
#fuelBar{width:120px;height:10px;background:#333;border-radius:5px;overflow:hidden;margin-top:4px}
#fuelFill{height:100%;background:linear-gradient(90deg,#38ef7d,#11998e);width:100%;transition:width .2s}
#mobileControls{position:absolute;bottom:0;left:0;right:0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:flex-end;z-index:60;pointer-events:none}
.ctrl-btn{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#fff;pointer-events:auto;backdrop-filter:blur(8px);user-select:none}
.ctrl-btn:active,.ctrl-btn.active{background:rgba(0,198,255,0.5);transform:scale(0.92)}
.ctrl-group{display:flex;gap:12px}
#pauseBtn{position:absolute;top:max(12px,env(safe-area-inset-top));right:16px;z-index:55;width:48px;height:48px;border-radius:12px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:1.4rem;cursor:pointer;display:none}
.menu-title{font-size:1.8rem;margin-bottom:20px;font-weight:800}
.car-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:16px;margin:8px;width:140px;text-align:center;cursor:pointer;transition:all .2s}
.car-card.selected{border-color:#00f5ff;box-shadow:0 0 20px rgba(0,245,255,0.3)}
.car-card.locked{opacity:0.5}
.upgrade-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.08);width:100%;max-width:360px}
.upgrade-row button{padding:8px 16px;border-radius:10px;border:none;background:#00c6ff;color:#fff;font-weight:700;cursor:pointer}
.popup{position:absolute;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:16px 28px;border-radius:16px;border:1px solid #00f5ff;z-index:200;font-weight:700;animation:pop .5s ease;pointer-events:none}
@keyframes pop{0%{transform:translateX(-50%) scale(0.5);opacity:0}50%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1);opacity:1}}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;width:min(320px,90vw)}
.stat{background:rgba(255,255,255,0.06);padding:12px;border-radius:12px;text-align:center}
.stat .val{font-size:1.4rem;color:#00f5ff;font-weight:800}
.settings-row{display:flex;justify-content:space-between;align-items:center;width:min(300px,85vw);margin:12px 0}
.toggle{width:56px;height:30px;background:#444;border-radius:15px;position:relative;cursor:pointer}
.toggle.on{background:#00c6ff}
.toggle::after{content:'';position:absolute;width:24px;height:24px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s}
.toggle.on::after{left:29px}
#loading{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;color:#fff}
.loader{width:60px;height:60px;border:4px solid #333;border-top-color:#00f5ff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.mission-item,.ach-item{padding:10px 14px;background:rgba(255,255,255,0.05);border-radius:10px;margin:6px 0;width:min(320px,90vw);display:flex;justify-content:space-between}
.back-btn{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;padding:10px 18px;border-radius:12px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);color:#fff;font-weight:700;cursor:pointer;z-index:10}
</style>
</head>
<body>
<div id="loading"><div class="loader"></div><div>Loading RUSH DRIVE 3D...</div></div>
<canvas id="gameCanvas"></canvas>

<!-- MAIN MENU -->
<div id="mainMenu" class="screen">
  <h1>RUSH DRIVE 3D</h1>
  <div class="subtitle">Arcade Racing</div>
  <button class="btn" id="playBtn">PLAY</button>
  <button class="btn secondary" id="garageBtn">GARAGE</button>
  <button class="btn secondary" id="upgradesBtn">UPGRADES</button>
  <button class="btn secondary" id="missionsBtn">MISSIONS</button>
  <button class="btn secondary" id="achievementsBtn">ACHIEVEMENTS</button>
  <button class="btn secondary" id="settingsBtn">SETTINGS</button>
</div>

<!-- GARAGE -->
<div id="garageScreen" class="screen hidden">
  <button class="back-btn" data-back="mainMenu">← BACK</button>
  <div class="menu-title">GARAGE</div>
  <div id="carList" style="display:flex;flex-wrap:wrap;justify-content:center;max-width:500px"></div>
  <div id="carStats" style="margin-top:20px;text-align:center;opacity:0.9"></div>
  <button class="btn success" id="selectCarBtn" style="margin-top:20px">SELECT CAR</button>
</div>

<!-- UPGRADES -->
<div id="upgradesScreen" class="screen hidden">
  <button class="back-btn" data-back="mainMenu">← BACK</button>
  <div class="menu-title">UPGRADES</div>
  <div id="coinsDisplayUpg" style="margin-bottom:16px;font-size:1.2rem">Coins: <span id="upgCoins">0</span></div>
  <div id="upgradeList"></div>
</div>

<!-- MISSIONS -->
<div id="missionsScreen" class="screen hidden">
  <button class="back-btn" data-back="mainMenu">← BACK</button>
  <div class="menu-title">MISSIONS</div>
  <div id="missionList"></div>
</div>

<!-- ACHIEVEMENTS -->
<div id="achievementsScreen" class="screen hidden">
  <button class="back-btn" data-back="mainMenu">← BACK</button>
  <div class="menu-title">ACHIEVEMENTS</div>
  <div id="achList"></div>
</div>

<!-- SETTINGS -->
<div id="settingsScreen" class="screen hidden">
  <button class="back-btn" data-back="mainMenu">← BACK</button>
  <div class="menu-title">SETTINGS</div>
  <div class="settings-row"><span>Music</span><div class="toggle on" id="musicToggle"></div></div>
  <div class="settings-row"><span>SFX</span><div class="toggle on" id="sfxToggle"></div></div>
  <div class="settings-row"><span>Graphics</span>
    <select id="gfxSelect" style="padding:8px 12px;border-radius:8px;background:#222;color:#fff;border:1px solid #555">
      <option value="low">LOW</option>
      <option value="medium" selected>MEDIUM</option>
      <option value="high">HIGH</option>
    </select>
  </div>
  <div class="settings-row"><span>Camera</span>
    <select id="camSelect" style="padding:8px 12px;border-radius:8px;background:#222;color:#fff;border:1px solid #555">
      <option value="0">Chase</option>
      <option value="1">Close</option>
      <option value="2">Far</option>
    </select>
  </div>
</div>

<!-- HUD -->
<div id="hud" style="display:none">
  <div>
    <div class="hud-item">SCORE <span id="scoreVal">0</span></div>
    <div class="hud-item" style="margin-top:6px">DIST <span id="distVal">0</span>m</div>
  </div>
  <div style="text-align:center">
    <div id="speedDisplay">0 km/h</div>
    <div class="hud-item" style="margin-top:4px">FUEL</div>
    <div id="fuelBar"><div id="fuelFill"></div></div>
  </div>
  <div>
    <div class="hud-item">🪙 <span id="coinVal">0</span></div>
    <div class="hud-item" style="margin-top:6px;display:none" id="boostStatus">BOOST</div>
  </div>
</div>
<button id="pauseBtn">⏸</button>

<!-- MOBILE CONTROLS -->
<div id="mobileControls">
  <div class="ctrl-group">
    <div class="ctrl-btn" id="btnLeft">◀</div>
    <div class="ctrl-btn" id="btnRight">▶</div>
  </div>
  <div class="ctrl-group">
    <div class="ctrl-btn" id="btnBrake">⏹</div>
    <div class="ctrl-btn" id="btnGas">▲</div>
    <div class="ctrl-btn" id="btnHandbrake" style="width:56px;height:56px;font-size:1.1rem">HB</div>
  </div>
</div>

<!-- PAUSE -->
<div id="pauseMenu" class="screen hidden">
  <div class="menu-title">PAUSED</div>
  <button class="btn" id="resumeBtn">RESUME</button>
  <button class="btn secondary" id="restartBtn">RESTART</button>
  <button class="btn secondary" id="pauseGarageBtn">GARAGE</button>
  <button class="btn secondary" id="pauseSettingsBtn">SETTINGS</button>
  <button class="btn danger" id="mainMenuBtn">MAIN MENU</button>
</div>

<!-- GAME OVER -->
<div id="gameOverScreen" class="screen hidden">
  <div class="menu-title" style="color:#ff416c">GAME OVER</div>
  <div class="stat-grid">
    <div class="stat"><div class="val" id="goScore">0</div>Score</div>
    <div class="stat"><div class="val" id="goDist">0</div>Distance</div>
    <div class="stat"><div class="val" id="goCoins">0</div>Coins</div>
    <div class="stat"><div class="val" id="goBest">0</div>Best</div>
  </div>
  <button class="btn" id="retryBtn">RETRY</button>
  <button class="btn secondary" id="goGarageBtn">GARAGE</button>
  <button class="btn secondary" id="goMainBtn">MAIN MENU</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// ==================== SAVE SYSTEM ====================
const Save = {
  data: {
    coins: 0,
    bestScore: 0,
    bestDistance: 0,
    selectedCar: 0,
    unlockedCars: [0],
    upgrades: {engine:0,turbo:0,tires:0,suspension:0,brakes:0,fuel:0,nitro:0},
    settings: {music:true,sfx:true,gfx:'medium',camera:0},
    achievements: {},
    missions: {drive1000:0,collect100:0,jumps5:0,speed100:0,nearmiss3:0,noCrash:0},
    missionProgress: {}
  },
  load() {
    try {
      const s = localStorage.getItem('rushDrive3D');
      if (s) {
        const p = JSON.parse(s);
        Object.assign(this.data, p);
        if (!this.data.upgrades) this.data.upgrades = {engine:0,turbo:0,tires:0,suspension:0,brakes:0,fuel:0,nitro:0};
      }
    } catch(e){}
  },
  save() {
    try { localStorage.setItem('rushDrive3D', JSON.stringify(this.data)); } catch(e){}
  }
};
Save.load();

// ==================== AUDIO (Web Audio API) ====================
const AudioSys = {
  ctx: null,
  enabled: true,
  musicOn: true,
  init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e){}
  },
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  playTone(freq, dur, type='square', vol=0.08) {
    if (!this.enabled || !Save.data.settings.sfx || !this.ctx) return;
    try {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + dur);
    } catch(e){}
  },
  coin() { this.playTone(880, 0.08, 'sine', 0.1); setTimeout(()=>this.playTone(1200,0.06,'sine',0.08),50); },
  crash() { this.playTone(80, 0.3, 'sawtooth', 0.15); this.playTone(40, 0.4, 'square', 0.1); },
  boost() { this.playTone(200, 0.15, 'sawtooth', 0.12); },
  jump() { this.playTone(300, 0.1, 'triangle', 0.1); },
  click() { this.playTone(600, 0.04, 'square', 0.06); },
  engine(speed) {
    // continuous engine handled separately if needed
  }
};

// ==================== CARS DATA ====================
const CARS = [
  {name:'Starter', price:0, speed:1.0, accel:1.0, handling:1.0, brake:1.0, jump:1.0, grip:1.0, color:0x3366ff},
  {name:'Sports', price:500, speed:1.25, accel:1.2, handling:1.15, brake:1.1, jump:1.05, grip:1.1, color:0xff2244},
  {name:'Muscle', price:1200, speed:1.35, accel:1.4, handling:0.9, brake:0.95, jump:0.95, grip:0.95, color:0xffaa00},
  {name:'Rally', price:2000, speed:1.15, accel:1.15, handling:1.3, brake:1.2, jump:1.25, grip:1.35, color:0x22cc44},
  {name:'Supercar', price:5000, speed:1.6, accel:1.5, handling:1.25, brake:1.3, jump:1.1, grip:1.2, color:0xaa00ff},
  {name:'Off-road SUV', price:3500, speed:1.1, accel:1.05, handling:1.1, brake:1.15, jump:1.4, grip:1.45, color:0x886633}
];

// ==================== UPGRADES ====================
const UPGRADE_DEFS = [
  {key:'engine', name:'Engine', max:5, cost:100, desc:'Acceleration'},
  {key:'turbo', name:'Turbo', max:5, cost:120, desc:'Top Speed'},
  {key:'tires', name:'Tires', max:5, cost:80, desc:'Grip'},
  {key:'suspension', name:'Suspension', max:5, cost:90, desc:'Landing'},
  {key:'brakes', name:'Brakes', max:5, cost:70, desc:'Braking'},
  {key:'fuel', name:'Fuel Tank', max:5, cost:110, desc:'Capacity'},
  {key:'nitro', name:'Nitro', max:5, cost:150, desc:'Boost Time'}
];

// ==================== ACHIEVEMENTS ====================
const ACHIEVEMENTS = [
  {id:'firstDrive', name:'First Drive', desc:'Complete your first run'},
  {id:'coinCollector', name:'Coin Collector', desc:'Collect 500 coins total'},
  {id:'speedDemon', name:'Speed Demon', desc:'Reach 150 km/h'},
  {id:'bigAir', name:'Big Air', desc:'Jump over 30m high'},
  {id:'driftMaster', name:'Drift Master', desc:'Drift for 10 seconds'},
  {id:'longDistance', name:'Long Distance', desc:'Drive 5000m in one run'},
  {id:'millionaire', name:'Millionaire', desc:'Earn 10000 coins total'},
  {id:'perfectLanding', name:'Perfect Landing', desc:'Land a big jump cleanly'}
];

// ==================== GAME STATE ====================
const Game = {
  state: 'menu', // menu, playing, paused, gameover
  score: 0,
  distance: 0,
  coinsThisRun: 0,
  fuel: 100,
  maxFuel: 100,
  speed: 0,
  boostTimer: 0,
  shieldTimer: 0,
  magnetTimer: 0,
  nitroTimer: 0,
  jumps: 0,
  stunts: 0,
  nearMisses: 0,
  crashed: false,
  combo: 1,
  lastComboTime: 0,
  isMobile: /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || ('ontouchstart' in window),
  keys: {},
  touch: {left:false,right:false,gas:false,brake:false,handbrake:false},
  camMode: 0,
  gfx: 'medium',
  time: 0,
  biome: 0,
  biomeProgress: 0
};

// ==================== THREE.JS SETUP ====================
let scene, camera, renderer, clock;
let player, playerMesh, wheels = [];
let roadSegments = [], obstacles = [], coins = [], powerups = [], traffic = [], particles = [];
let sky, sun, ambient, dirLight;
let roadPool = [], obstaclePool = [], coinPool = [];
const ROAD_WIDTH = 12;
const SEGMENT_LENGTH = 40;
const VIEW_DIST = 350;

function initThree() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x87CEEB, 0.0025);
  
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.5, 800);
  camera.position.set(0, 8, 15);
  
  renderer = new THREE.WebGLRenderer({canvas: document.getElementById('gameCanvas'), antialias: true, powerPreference: 'high-performance'});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, Game.gfx === 'low' ? 1 : 1.5));
  renderer.shadowMap.enabled = Game.gfx !== 'low';
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  
  ambient = new THREE.AmbientLight(0x6688aa, 0.55);
  scene.add(ambient);
  
  dirLight = new THREE.DirectionalLight(0xfff5e0, 1.1);
  dirLight.position.set(50, 80, 30);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = Game.gfx === 'high' ? 2048 : 1024;
  dirLight.shadow.mapSize.height = dirLight.shadow.mapSize.width;
  dirLight.shadow.camera.near = 10;
  dirLight.shadow.camera.far = 300;
  dirLight.shadow.camera.left = -80;
  dirLight.shadow.camera.right = 80;
  dirLight.shadow.camera.top = 80;
  dirLight.shadow.camera.bottom = -80;
  scene.add(dirLight);
  
  // Sky
  const skyGeo = new THREE.SphereGeometry(600, 32, 16);
  const skyMat = new THREE.MeshBasicMaterial({color: 0x87CEEB, side: THREE.BackSide});
  sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);
  
  // Ground plane (far)
  const groundGeo = new THREE.PlaneGeometry(2000, 2000);
  const groundMat = new THREE.MeshLambertMaterial({color: 0x3a7d3a});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -2;
  ground.receiveShadow = true;
  scene.add(ground);
  
  clock = new THREE.Clock();
  
  createPlayer();
  generateInitialWorld();
  
  window.addEventListener('resize', onResize);
  onResize();
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, Game.gfx === 'low' ? 1 : 1.5));
}

// ==================== PLAYER CAR ====================
function createPlayer() {
  const car = CARS[Save.data.selectedCar];
  const group = new THREE.Group();
  
  // Body
  const bodyGeo = new THREE.BoxGeometry(2.2, 0.7, 4.2);
  const bodyMat = new THREE.MeshStandardMaterial({color: car.color, metalness: 0.7, roughness: 0.35});
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.6;
  body.castShadow = true;
  group.add(body);
  
  // Cabin
  const cabinGeo = new THREE.BoxGeometry(1.9, 0.55, 2.0);
  const cabinMat = new THREE.MeshStandardMaterial({color: 0x111122, metalness: 0.3, roughness: 0.2, transparent: true, opacity: 0.85});
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0, 1.15, -0.2);
  cabin.castShadow = true;
  group.add(cabin);
  
  // Spoiler
  const spoilGeo = new THREE.BoxGeometry(2.0, 0.12, 0.4);
  const spoil = new THREE.Mesh(spoilGeo, bodyMat);
  spoil.position.set(0, 1.1, -1.9);
  group.add(spoil);
  
  // Headlights
  const hlGeo = new THREE.BoxGeometry(0.35, 0.2, 0.15);
  const hlMat = new THREE.MeshBasicMaterial({color: 0xffffcc});
  const hl1 = new THREE.Mesh(hlGeo, hlMat); hl1.position.set(0.7, 0.55, 2.05);
  const hl2 = new THREE.Mesh(hlGeo, hlMat); hl2.position.set(-0.7, 0.55, 2.05);
  group.add(hl1, hl2);
  
  // Taillights
  const tlMat = new THREE.MeshBasicMaterial({color: 0xff2200});
  const tl1 = new THREE.Mesh(hlGeo, tlMat); tl1.position.set(0.7, 0.55, -2.05);
  const tl2 = new THREE.Mesh(hlGeo, tlMat); tl2.position.set(-0.7, 0.55, -2.05);
  group.add(tl1, tl2);
  
  // Wheels
  wheels = [];
  const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 12);
  const wheelMat = new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.9});
  const rimGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.36, 8);
  const rimMat = new THREE.MeshStandardMaterial({color: 0xcccccc, metalness: 0.9, roughness: 0.3});
  
  const positions = [
    [1.05, 0.42, 1.35], [-1.05, 0.42, 1.35],
    [1.05, 0.42, -1.35], [-1.05, 0.42, -1.35]
  ];
  positions.forEach((p,i) => {
    const w = new THREE.Group();
    const tire = new THREE.Mesh(wheelGeo, wheelMat);
    tire.rotation.z = Math.PI/2;
    const rim = new THREE.Mesh(rimGeo, rimMat);
    rim.rotation.z = Math.PI/2;
    w.add(tire, rim);
    w.position.set(p[0], p[1], p[2]);
    w.castShadow = true;
    group.add(w);
    wheels.push(w);
  });
  
  // Shadow
  const shadowGeo = new THREE.PlaneGeometry(2.8, 5);
  const shadowMat = new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.35});
  const shadow = new THREE.Mesh(shadowGeo, shadowMat);
  shadow.rotation.x = -Math.PI/2;
  shadow.position.y = 0.05;
  group.add(shadow);
  
  playerMesh = group;
  player = {
    mesh: group,
    x: 0, y: 0.5, z: 0,
    vx: 0, vy: 0, vz: 0,
    rotY: 0, rotX: 0, rotZ: 0,
    onGround: true,
    steering: 0,
    accel: 0
  };
  scene.add(group);
}

function updatePlayerCarVisual() {

// ==================== WORLD GENERATION ====================
const biomeColors = [
  {ground:0x3a7d3a, road:0x444444, sky:0x87CEEB, fog:0x87CEEB}, // Green Valley
  {ground:0x5a6a5a, road:0x555555, sky:0x6a8aaa, fog:0x6a8aaa}, // Mountain
  {ground:0xc2a15a, road:0x8b7355, sky:0xffd580, fog:0xffd580}, // Desert
  {ground:0xe8f0f8, road:0x8899aa, sky:0xb0c4de, fog:0xb0c4de}, // Snow
  {ground:0x222233, road:0x333344, sky:0x0a0a1a, fog:0x1a1a2a}  // Night City
];

function setBiome(idx) {
  Game.biome = idx % 5;
  const b = biomeColors[Game.biome];
  scene.fog.color.setHex(b.fog);
  sky.material.color.setHex(b.sky);
  if (Game.biome === 4) {
    ambient.intensity = 0.25;
    dirLight.intensity = 0.3;
    dirLight.color.setHex(0x4466aa);
  } else {
    ambient.intensity = 0.55;
    dirLight.intensity = 1.1;
    dirLight.color.setHex(0xfff5e0);
  }
}

function createRoadSegment(z) {
  const group = new THREE.Group();
  const b = biomeColors[Game.biome];
  
  // Road
  const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, SEGMENT_LENGTH);
  const roadMat = new THREE.MeshLambertMaterial({color: b.road});
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI/2;
  road.position.y = 0.02;
  road.receiveShadow = true;
  group.add(road);
  
  // Center line
  const lineGeo = new THREE.PlaneGeometry(0.25, SEGMENT_LENGTH * 0.6);
  const lineMat = new THREE.MeshBasicMaterial({color: 0xffff00});
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.rotation.x = -Math.PI/2;
  line.position.set(0, 0.03, 0);
  group.add(line);
  
  // Side barriers / grass edges
  const edgeGeo = new THREE.BoxGeometry(1.5, 0.4, SEGMENT_LENGTH);
  const edgeMat = new THREE.MeshLambertMaterial({color: b.ground});
  const left = new THREE.Mesh(edgeGeo, edgeMat);
  left.position.set(-ROAD_WIDTH/2 - 0.7, 0.2, 0);
  left.receiveShadow = true;
  const right = new THREE.Mesh(edgeGeo, edgeMat);
  right.position.set(ROAD_WIDTH/2 + 0.7, 0.2, 0);
  right.receiveShadow = true;
  group.add(left, right);
  
  // Random props
  if (Math.random() < 0.4) {
    const tree = createTree();
    tree.position.set((Math.random()>0.5?1:-1) * (ROAD_WIDTH/2 + 3 + Math.random()*4), 0, (Math.random()-0.5)*SEGMENT_LENGTH);
    group.add(tree);
  }
  if (Math.random() < 0.25) {
    const rock = createRock();
    rock.position.set((Math.random()>0.5?1:-1) * (ROAD_WIDTH/2 + 2 + Math.random()*3), 0, (Math.random()-0.5)*SEGMENT_LENGTH);
    group.add(rock);
  }
  
  // Street light sometimes
  if (Math.random() < 0.15) {
    const light = createStreetLight();
    light.position.set((Math.random()>0.5?1:-1)*(ROAD_WIDTH/2+1.5), 0, 0);
    group.add(light);
  }
  
  group.position.z = z;
  scene.add(group);
  return {mesh: group, z: z};
}

function createTree() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,1.5,6), new THREE.MeshLambertMaterial({color:0x5a3a1a}));
  trunk.position.y = 0.75;
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.2, 7), new THREE.MeshLambertMaterial({color: Game.biome===3 ? 0xddddff : 0x228833}));
  leaves.position.y = 2.5;
  g.add(trunk, leaves);
  return g;
}

function createRock() {
  const geo = new THREE.DodecahedronGeometry(0.6 + Math.random()*0.5, 0);
  const mat = new THREE.MeshLambertMaterial({color: 0x666666});
  const m = new THREE.Mesh(geo, mat);
  m.position.y = 0.4;
  m.castShadow = true;
  return m;
}

function createStreetLight() {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,4,6), new THREE.MeshLambertMaterial({color:0x333333}));
  pole.position.y = 2;
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3,8,6), new THREE.MeshBasicMaterial({color:0xffffaa}));
  lamp.position.y = 4.1;
  g.add(pole, lamp);
  if (Game.biome === 4) {
    const light = new THREE.PointLight(0xffffaa, 1.5, 25);
    light.position.y = 4;
    g.add(light);
  }
  return g;
}

function createObstacle(z, type) {
  const g = new THREE.Group();
  let mesh;
  if (type === 'rock') {
    mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9,0), new THREE.MeshLambertMaterial({color:0x555555}));
    mesh.position.y = 0.6;
  } else if (type === 'barrier') {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 0.6), new THREE.MeshLambertMaterial({color:0xff6600}));
    mesh.position.y = 0.6;
  } else if (type === 'cone') {
    mesh = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.0, 8), new THREE.MeshLambertMaterial({color:0xff4400}));
    mesh.position.y = 0.5;
  } else {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, 1.5), new THREE.MeshLambertMaterial({color:0x884422}));
    mesh.position.y = 0.5;
  }
  mesh.castShadow = true;
  g.add(mesh);
  g.position.set((Math.random()-0.5)* (ROAD_WIDTH-3), 0, z);
  scene.add(g);
  return {mesh: g, z: z, type, radius: 1.2};
}

function createCoin(z, x) {
  const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.12, 12);
  const mat = new THREE.MeshStandardMaterial({color: 0xffd700, metalness: 0.9, roughness: 0.3, emissive: 0x553300});
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = Math.PI/2;
  m.position.set(x, 1.2, z);
  scene.add(m);
  return {mesh: m, z, x, collected: false};
}

function createPowerup(z, type) {
  const colors = {boost:0x00ffff, shield:0x00ff88, magnet:0xff00ff, nitro:0xff4400, fuel:0x44ff44};
  const geo = new THREE.OctahedronGeometry(0.6);
  const mat = new THREE.MeshStandardMaterial({color: colors[type]||0xffffff, emissive: colors[type], emissiveIntensity:0.4});
  const m = new THREE.Mesh(geo, mat);
  m.position.set((Math.random()-0.5)*6, 1.5, z);
  scene.add(m);
  return {mesh: m, z, type, collected:false};
}

function generateInitialWorld() {
  roadSegments = [];
  obstacles = [];
  coins = [];
  powerups = [];
  for (let i = -2; i < 12; i++) {
    const z = i * SEGMENT_LENGTH;
    roadSegments.push(createRoadSegment(z));
    if (i > 2 && Math.random() < 0.35) {
      obstacles.push(createObstacle(z + Math.random()*SEGMENT_LENGTH, ['rock','barrier','cone','box'][Math.floor(Math.random()*4)]));
    }
    if (i > 1) {
      for (let c=0;c<3;c++) {
        if (Math.random()<0.5) coins.push(createCoin(z + c*12 + Math.random()*5, (Math.random()-0.5)*6));
      }
      if (Math.random()<0.15) {
        const types = ['boost','shield','magnet','nitro','fuel'];
        powerups.push(createPowerup(z + Math.random()*SEGMENT_LENGTH, types[Math.floor(Math.random()*types.length)]));
      }
    }
  }
}

function updateWorld() {
  const pz = player.z;
  // Remove behind
  while (roadSegments.length && roadSegments[0].z < pz - 80) {
    scene.remove(roadSegments[0].mesh);
    roadSegments.shift();
  }
  while (obstacles.length && obstacles[0].z < pz - 40) {
    scene.remove(obstacles[0].mesh);
    obstacles.shift();
  }
  while (coins.length && coins[0].z < pz - 30) {
    scene.remove(coins[0].mesh);
    coins.shift();
  }
  while (powerups.length && powerups[0].z < pz - 30) {
    scene.remove(powerups[0].mesh);
    powerups.shift();
  }
  
  // Add ahead (fixed: lastZ is now recalculated every iteration)
  while (true) {
    const lastZ = roadSegments.length ? roadSegments[roadSegments.length - 1].z : 0;
    if (lastZ + SEGMENT_LENGTH >= pz + VIEW_DIST) break;

    const nz = lastZ + SEGMENT_LENGTH;

    // Biome change every ~800m
    Game.biomeProgress += SEGMENT_LENGTH;
    if (Game.biomeProgress > 800) {
      Game.biomeProgress = 0;
      setBiome(Game.biome + 1);
    }
    roadSegments.push(createRoadSegment(nz));
    
    const difficulty = Math.min(0.7, 0.2 + player.z / 8000);
    if (Math.random() < difficulty) {
      obstacles.push(createObstacle(nz + Math.random()*SEGMENT_LENGTH, ['rock','barrier','cone','box'][Math.floor(Math.random()*4)]));
    }
    for (let c=0;c<4;c++) {
      if (Math.random()<0.55) coins.push(createCoin(nz + c*10 + Math.random()*6, (Math.random()-0.5)*7));
    }
    if (Math.random()<0.12) {
      const types = ['boost','shield','magnet','nitro','fuel'];
      powerups.push(createPowerup(nz + Math.random()*SEGMENT_LENGTH, types[Math.floor(Math.random()*types.length)]));
    }
  }
}

// ==================== PHYSICS ====================
function getCarStats() {
  const base = CARS[Save.data.selectedCar];
  const up = Save.data.upgrades;
  return {
    maxSpeed: 42 * base.speed * (1 + up.turbo * 0.08),
    accel: 28 * base.accel * (1 + up.engine * 0.1),
    handling: 2.8 * base.handling * (1 + up.tires * 0.08),
    brake: 35 * base.brake * (1 + up.brakes * 0.1),
    grip: base.grip * (1 + up.tires * 0.07),
    jumpStab: base.jump * (1 + up.suspension * 0.1),
    fuelCap: 100 + up.fuel * 25,
    nitroTime: 2.5 + up.nitro * 0.6
  };
}

function updatePhysics(dt) {
  if (Game.state !== 'playing') return;
  const stats = getCarStats();
  Game.maxFuel = stats.fuelCap;
  
  // Input
  let steer = 0, throttle = 0, brake = 0, handbrake = false;
  if (Game.keys['ArrowLeft'] || Game.keys['a'] || Game.keys['A'] || Game.touch.left) steer = 1;
  if (Game.keys['ArrowRight'] || Game.keys['d'] || Game.keys['D'] || Game.touch.right) steer = -1;
  if (Game.keys['ArrowUp'] || Game.keys['w'] || Game.keys['W'] || Game.touch.gas) throttle = 1;
  if (Game.keys['ArrowDown'] || Game.keys['s'] || Game.keys['S'] || Game.touch.brake) brake = 1;
  if (Game.keys[' '] || Game.touch.handbrake) handbrake = true;
  
  // Steering
  const speedFactor = Math.min(1, Math.abs(player.vz) / 15);
  player.steering = THREE.MathUtils.lerp(player.steering, steer * stats.handling * (0.4 + 0.6*speedFactor), 8*dt);
  player.rotY += player.steering * dt * (handbrake ? 1.6 : 1.0);
  
  // Acceleration / braking
  if (throttle && Game.fuel > 0) {
    player.vz += stats.accel * dt * (Game.boostTimer > 0 || Game.nitroTimer > 0 ? 1.6 : 1);
  }
  if (brake) {
    player.vz -= stats.brake * dt * (player.vz > 0 ? 1 : -0.6);
  }
  if (handbrake && player.onGround) {
    player.vz *= (1 - 1.8*dt);
    player.steering *= 1.3;
  }
  
  // Friction
  player.vz *= (1 - 0.35 * dt * (1 / stats.grip));
  
  // Speed clamp
  const maxSpd = stats.maxSpeed * (Game.boostTimer > 0 ? 1.35 : 1) * (Game.nitroTimer > 0 ? 1.5 : 1);
  if (player.vz > maxSpd) player.vz = maxSpd;
  if (player.vz < -12) player.vz = -12;
  
  // Lateral
  player.vx = -Math.sin(player.rotY) * player.vz * 0.15;
  
  // Gravity & jump
  if (!player.onGround) {
    player.vy -= 28 * dt;
  } else {
    player.vy = 0;
    // Small bumps
    if (Math.random() < 0.002 && player.vz > 20) {
      player.vy = 8 + Math.random()*6;
      player.onGround = false;
      Game.jumps++;
      AudioSys.jump();
    }
  }
  
  // Integrate
  player.x += player.vx * dt + Math.sin(player.rotY) * player.vz * dt;
  player.y += player.vy * dt;
  player.z += Math.cos(player.rotY) * player.vz * dt;
  
  // Road bounds (soft)
  const maxX = ROAD_WIDTH/2 - 1.2;
  if (player.x > maxX) { player.x = maxX; player.vx *= -0.3; }
  if (player.x < -maxX) { player.x = -maxX; player.vx *= -0.3; }
  
  // Ground
  if (player.y <= 0.5) {
    if (!player.onGround && player.vy < -5) {
      // landing
      const impact = Math.abs(player.vy);
      if (impact > 18) {
        // hard landing - possible crash
        if (impact > 28 && Game.shieldTimer <= 0) {
          doCrash();
          return;
        }
      } else if (impact > 10) {
        // perfect landing chance
        if (Math.random() < 0.3) unlockAchievement('perfectLanding');
      }
      spawnLandingDust();
    }
    player.y = 0.5;
    player.vy = 0;
    player.onGround = true;
  }
  
  // Fuel
  if (player.vz > 1) {
    Game.fuel -= (0.8 + player.vz * 0.015) * dt * (Game.boostTimer > 0 ? 1.5 : 1);
  }
  if (Game.fuel <= 0) {
    Game.fuel = 0;
    player.vz *= (1 - 2*dt);
    if (Math.abs(player.vz) < 2) {
      endGame('fuel');
      return;
    }
  }
  
  // Timers
  if (Game.boostTimer > 0) Game.boostTimer -= dt;
  if (Game.shieldTimer > 0) Game.shieldTimer -= dt;
  if (Game.magnetTimer > 0) Game.magnetTimer -= dt;
  if (Game.nitroTimer > 0) Game.nitroTimer -= dt;
  
  // Apply to mesh
  player.mesh.position.set(player.x, player.y, player.z);
  player.mesh.rotation.y = player.rotY;
  player.mesh.rotation.z = -player.steering * 0.15;
  player.mesh.rotation.x = player.onGround ? 0 : player.vy * 0.01;
  
  // Wheel rotation
  const wheelSpin = player.vz * dt * 2.5;
  wheels.forEach(w => { w.rotation.x += wheelSpin; });
  
  // Speed for HUD
  Game.speed = Math.abs(player.vz) * 3.6; // rough km/h
  
  // Distance & score
  if (player.vz > 0) {
    Game.distance += player.vz * dt;
    Game.score += Math.floor(player.vz * dt * 2 * Game.combo);
  }
  
  // Combo decay
  if (performance.now() - Game.lastComboTime > 2000) Game.combo = Math.max(1, Game.combo - dt);
}

function doCrash() {
  if (Game.shieldTimer > 0) {
    Game.shieldTimer = 0;
    spawnCrashParticles();
    AudioSys.crash();
    return;
  }
  Game.crashed = true;
  spawnCrashParticles();
  AudioSys.crash();
  endGame('crash');
}

function endGame(reason) {
  Game.state = 'gameover';
  // Save progress
  Save.data.coins += Game.coinsThisRun;
  if (Game.score > Save.data.bestScore) Save.data.bestScore = Math.floor(Game.score);
  if (Game.distance > Save.data.bestDistance) Save.data.bestDistance = Math.floor(Game.distance);
  
  // Missions / achievements
  if (Game.distance >= 1000) Save.data.missions.drive1000 = 1;
  if (Game.coinsThisRun >= 100) Save.data.missions.collect100 = 1;
  if (Game.jumps >= 5) Save.data.missions.jumps5 = 1;
  if (Game.speed >= 100) Save.data.missions.speed100 = 1;
  if (Game.nearMisses >= 3) Save.data.missions.nearmiss3 = 1;
  if (!Game.crashed) Save.data.missions.noCrash = 1;
  
  unlockAchievement('firstDrive');
  if (Save.data.coins >= 500) unlockAchievement('coinCollector');
  if (Game.speed >= 150) unlockAchievement('speedDemon');
  if (Game.distance >= 5000) unlockAchievement('longDistance');
  if (Save.data.coins >= 10000) unlockAchievement('millionaire');
  
  Save.save();
  
  document.getElementById('goScore').textContent = Math.floor(Game.score);
  document.getElementById('goDist').textContent = Math.floor(Game.distance) + 'm';
  document.getElementById('goCoins').textContent = Game.coinsThisRun;
  document.getElementById('goBest').textContent = Save.data.bestScore;
  
  showScreen('gameOverScreen');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('mobileControls').style.display = 'none';
}

function unlockAchievement(id) {
  if (!Save.data.achievements[id]) {
    Save.data.achievements[id] = true;
    Save.save();
    showPopup('Achievement: ' + (ACHIEVEMENTS.find(a=>a.id===id)||{name:id}).name);
  }
}

function showPopup(text) {
  const p = document.createElement('div');
  p.className = 'popup';
  p.textContent = text;
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 2200);
}

// ==================== COLLISIONS ====================
function checkCollisions() {
  const px = player.x, pz = player.z, pr = 1.6;
  
  // Obstacles
  for (let i = obstacles.length-1; i >= 0; i--) {
    const o = obstacles[i];
    const dx = o.mesh.position.x - px;
    const dz = o.mesh.position.z - pz;
    if (dx*dx + dz*dz < (pr + o.radius)*(pr + o.radius)) {
      if (Math.abs(player.y - 0.5) < 1.5) {
        // near miss if fast and slightly off
        if (Math.abs(dx) > 1.5 && player.vz > 25) {
          Game.nearMisses++;
          Game.score += 50 * Game.combo;
          Game.combo = Math.min(5, Game.combo + 0.3);
          Game.lastComboTime = performance.now();
        } else {
          doCrash();
          return;
        }
      }
    }
  }
  
  // Coins
  for (let i = coins.length-1; i >= 0; i--) {
    const c = coins[i];
    if (c.collected) continue;
    let dx = c.mesh.position.x - px;
    let dz = c.mesh.position.z - pz;
    let dist = dx*dx + dz*dz;
    if (Game.magnetTimer > 0 && dist < 100) {
      c.mesh.position.x += (px - c.mesh.position.x) * 0.15;
      c.mesh.position.z += (pz - c.mesh.position.z) * 0.15;
      dx = c.mesh.position.x - px;
      dz = c.mesh.position.z - pz;
      dist = dx*dx + dz*dz;
    }
    if (dist < 4) {
      c.collected = true;
      scene.remove(c.mesh);
      coins.splice(i,1);
      Game.coinsThisRun += 1;
      Game.score += 10 * Game.combo;
      Game.combo = Math.min(5, Game.combo + 0.15);
      Game.lastComboTime = performance.now();
      AudioSys.coin();
      spawnCoinEffect(c.mesh.position);
    }
  }
  
  // Powerups
  for (let i = powerups.length-1; i >= 0; i--) {
    const p = powerups[i];
    if (p.collected) continue;
    const dx = p.mesh.position.x - px;
    const dz = p.mesh.position.z - pz;
    if (dx*dx + dz*dz < 5) {
      p.collected = true;
      scene.remove(p.mesh);
      powerups.splice(i,1);
      if (p.type === 'boost') { Game.boostTimer = 4; AudioSys.boost(); }
      else if (p.type === 'shield') { Game.shieldTimer = 8; }
      else if (p.type === 'magnet') { Game.magnetTimer = 6; }
      else if (p.type === 'nitro') { Game.nitroTimer = getCarStats().nitroTime; AudioSys.boost(); }
      else if (p.type === 'fuel') { Game.fuel = Math.min(Game.maxFuel, Game.fuel + 35); }
      showPopup(p.type.toUpperCase() + '!');
    }
  }
}

// ==================== PARTICLES (simple) ====================
function spawnCoinEffect(pos) {
  for (let i=0;i<6;i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.15,4,4), new THREE.MeshBasicMaterial({color:0xffd700}));
    m.position.copy(pos);
    scene.add(m);
    particles.push({mesh:m, life:0.6, vx:(Math.random()-0.5)*6, vy:3+Math.random()*4, vz:(Math.random()-0.5)*6});
  }
}
function spawnLandingDust() {
  for (let i=0;i<8;i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.25,4,4), new THREE.MeshBasicMaterial({color:0xaaaaaa, transparent:true, opacity:0.6}));
    m.position.set(player.x+(Math.random()-0.5)*2, 0.3, player.z+(Math.random()-0.5)*2);
    scene.add(m);
    particles.push({mesh:m, life:0.8, vx:(Math.random()-0.5)*3, vy:1+Math.random()*2, vz:(Math.random()-0.5)*3});
  }
}
function spawnCrashParticles() {
  for (let i=0;i<15;i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshBasicMaterial({color:0xff4400}));
    m.position.set(player.x, player.y+0.5, player.z);
    scene.add(m);
    particles.push({mesh:m, life:1.2, vx:(Math.random()-0.5)*12, vy:4+Math.random()*8, vz:(Math.random()-0.5)*12});
  }
}
function updateParticles(dt) {
  for (let i=particles.length-1;i>=0;i--) {
    const p = particles[i];
    p.life -= dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.vy -= 15 * dt;
    p.mesh.material.opacity = Math.max(0, p.life);
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i,1);
    }
  }
}

// ==================== CAMERA ====================
function updateCamera(dt) {
  const mode = Save.data.settings.camera || 0;
  let dist = mode === 1 ? 8 : mode === 2 ? 18 : 12;
  let height = mode === 1 ? 4 : mode === 2 ? 9 : 6;
  
  const targetX = player.x - Math.sin(player.rotY) * dist;
  const targetZ = player.z - Math.cos(player.rotY) * dist;
  const targetY = player.y + height + (player.onGround ? 0 : 2);
  
  camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetX, 4*dt);
  camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetY, 4*dt);
  camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 4*dt);
  
  // Look at slightly ahead
  const lookX = player.x + Math.sin(player.rotY) * 5;
  const lookZ = player.z + Math.cos(player.rotY) * 5;
  camera.lookAt(lookX, player.y + 1.5, lookZ);
  
  // FOV by speed
  const targetFov = 55 + Math.min(20, Game.speed * 0.12);
  camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, 3*dt);
  camera.updateProjectionMatrix();
}

// ==================== INPUT ====================
function setupInput() {
  window.addEventListener('keydown', e => {
    Game.keys[e.key] = true;
    if (e.key === 'p' || e.key === 'P') togglePause();
    if (e.key === 'r' || e.key === 'R') { if (Game.state==='playing') resetCar(); }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { Game.keys[e.key] = false; });
  
  // Touch
  const btns = {
    btnLeft: 'left', btnRight: 'right', btnGas: 'gas', btnBrake: 'brake', btnHandbrake: 'handbrake'
  };
  Object.keys(btns).forEach(id => {
    const el = document.getElementById(id);
    const key = btns[id];
    const start = e => { e.preventDefault(); Game.touch[key] = true; el.classList.add('active'); AudioSys.resume(); };
    const end = e => { e.preventDefault(); Game.touch[key] = false; el.classList.remove('active'); };
    el.addEventListener('touchstart', start, {passive:false});
    el.addEventListener('touchend', end, {passive:false});
    el.addEventListener('touchcancel', end, {passive:false});
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
  });
  
  // Prevent scroll
  document.body.addEventListener('touchmove', e => { if (Game.state==='playing') e.preventDefault(); }, {passive:false});
}

function resetCar() {
  player.y = 0.5;
  player.vy = 0;
  player.rotX = 0;
  player.rotZ = 0;
  player.onGround = true;
  player.mesh.rotation.x = 0;
  player.mesh.rotation.z = 0;
}

// ==================== UI ====================
function showScreen(id) {
  ['mainMenu','garageScreen','upgradesScreen','missionsScreen','achievementsScreen','settingsScreen','pauseMenu','gameOverScreen'].forEach(s => {
    document.getElementById(s).classList.add('hidden');
  });
  if (id) document.getElementById(id).classList.remove('hidden');
}

function startGame() {
  AudioSys.resume();
  AudioSys.click();
  Game.state = 'playing';
  Game.score = 0;
  Game.distance = 0;
  Game.coinsThisRun = 0;
  Game.fuel = getCarStats().fuelCap;
  Game.maxFuel = Game.fuel;
  Game.boostTimer = 0;
  Game.shieldTimer = 0;
  Game.magnetTimer = 0;
  Game.nitroTimer = 0;
  Game.jumps = 0;
  Game.stunts = 0;
  Game.nearMisses = 0;
  Game.crashed = false;
  Game.combo = 1;
  
  // Reset player
  player.x = 0; player.y = 0.5; player.z = 0;
  player.vx = 0; player.vy = 0; player.vz = 0;
  player.rotY = 0; player.steering = 0;
  player.onGround = true;
  
  // Clear world
  roadSegments.forEach(s => scene.remove(s.mesh));
  obstacles.forEach(o => scene.remove(o.mesh));
  coins.forEach(c => scene.remove(c.mesh));
  powerups.forEach(p => scene.remove(p.mesh));
  particles.forEach(p => scene.remove(p.mesh));
  roadSegments = []; obstacles = []; coins = []; powerups = []; particles = [];
  
  setBiome(0);
  Game.biomeProgress = 0;
  generateInitialWorld();
  updatePlayerCarVisual();
  
  showScreen(null);
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('pauseBtn').style.display = 'block';
  if (Game.isMobile) document.getElementById('mobileControls').style.display = 'flex';
}

function togglePause() {
  if (Game.state === 'playing') {
    Game.state = 'paused';
    showScreen('pauseMenu');
  } else if (Game.state === 'paused') {
    Game.state = 'playing';
    showScreen(null);
  }
}

function updateHUD() {
  document.getElementById('scoreVal').textContent = Math.floor(Game.score);
  document.getElementById('distVal').textContent = Math.floor(Game.distance);
  document.getElementById('coinVal').textContent = Game.coinsThisRun;
  document.getElementById('speedDisplay').textContent = Math.floor(Game.speed) + ' km/h';
  document.getElementById('fuelFill').style.width = (Game.fuel / Game.maxFuel * 100) + '%';
  const boostEl = document.getElementById('boostStatus');
  if (Game.boostTimer > 0 || Game.nitroTimer > 0) {
    boostEl.style.display = 'block';
    boostEl.textContent = Game.nitroTimer > 0 ? 'NITRO' : 'BOOST';
  } else boostEl.style.display = 'none';
}

function buildGarage() {
  const list = document.getElementById('carList');
  list.innerHTML = '';
  CARS.forEach((c, i) => {
    const unlocked = Save.data.unlockedCars.includes(i);
    const div = document.createElement('div');
    div.className = 'car-card' + (Save.data.selectedCar===i?' selected':'') + (!unlocked?' locked':'');
    div.innerHTML = `<div style="font-weight:800">${c.name}</div>
      <div style="width:40px;height:24px;background:#${c.color.toString(16).padStart(6,'0')};margin:8px auto;border-radius:4px"></div>
      <div style="font-size:0.85rem">${unlocked ? 'Owned' : c.price + ' 🪙'}</div>`;
    div.onclick = () => {
      if (!unlocked) {
        if (Save.data.coins >= c.price) {
          Save.data.coins -= c.price;
          Save.data.unlockedCars.push(i);
          Save.save();
          buildGarage();
          showPopup('Unlocked ' + c.name + '!');
        } else showPopup('Not enough coins');
        return;
      }
      Save.data.selectedCar = i;
      Save.save();
      buildGarage();
      updatePlayerCarVisual();
    };
    list.appendChild(div);
  });
  const car = CARS[Save.data.selectedCar];
  document.getElementById('carStats').innerHTML = `Speed ${car.speed} | Accel ${car.accel} | Handling ${car.handling} | Grip ${car.grip}`;
}

function buildUpgrades() {
  document.getElementById('upgCoins').textContent = Save.data.coins;
  const list = document.getElementById('upgradeList');
  list.innerHTML = '';
  UPGRADE_DEFS.forEach(u => {
    const level = Save.data.upgrades[u.key] || 0;
    const cost = u.cost * (level + 1);
    const row = document.createElement('div');
    row.className = 'upgrade-row';
    row.innerHTML = `<div><b>${u.name}</b> Lv${level}/${u.max}<br><small>${u.desc}</small></div>
      <button ${level>=u.max?'disabled':''}>${level>=u.max?'MAX':cost+' 🪙'}</button>`;
    const btn = row.querySelector('button');
    btn.onclick = () => {
      if (level >= u.max) return;
      if (Save.data.coins >= cost) {
        Save.data.coins -= cost;
        Save.data.upgrades[u.key] = level + 1;
        Save.save();
        buildUpgrades();
        AudioSys.click();
      } else showPopup('Not enough coins');
    };
    list.appendChild(row);
  });
}

function buildMissions() {
  const list = document.getElementById('missionList');
  list.innerHTML = '';
  const missions = [
    {key:'drive1000', name:'Drive 1,000m', reward:50},
    {key:'collect100', name:'Collect 100 coins', reward:40},
    {key:'jumps5', name:'Perform 5 jumps', reward:30},
    {key:'speed100', name:'Reach 100 km/h', reward:25},
    {key:'nearmiss3', name:'3 Near Misses', reward:35},
    {key:'noCrash', name:'Drive without crashing', reward:60}
  ];
  missions.forEach(m => {
    const done = Save.data.missions[m.key];
    const div = document.createElement('div');
    div.className = 'mission-item';
    div.innerHTML = `<span>${m.name}</span><span>${done ? '✓ Done' : m.reward + ' 🪙'}</span>`;
    list.appendChild(div);
  });
}

function buildAchievements() {
  const list = document.getElementById('achList');
  list.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const done = Save.data.achievements[a.id];
    const div = document.createElement('div');
    div.className = 'ach-item';
    div.innerHTML = `<span>${a.name}<br><small style="opacity:0.7">${a.desc}</small></span><span>${done?'🏆':'🔒'}</span>`;
    list.appendChild(div);
  });
}

function setupUI() {
  document.getElementById('playBtn').onclick = () => { startGame(); };
  document.getElementById('garageBtn').onclick = () => { buildGarage(); showScreen('garageScreen'); AudioSys.click(); };
  document.getElementById('upgradesBtn').onclick = () => { buildUpgrades(); showScreen('upgradesScreen'); AudioSys.click(); };
  document.getElementById('missionsBtn').onclick = () => { buildMissions(); showScreen('missionsScreen'); AudioSys.click(); };
  document.getElementById('achievementsBtn').onclick = () => { buildAchievements(); showScreen('achievementsScreen'); AudioSys.click(); };
  document.getElementById('settingsBtn').onclick = () => { showScreen('settingsScreen'); AudioSys.click(); };
  
  document.querySelectorAll('.back-btn').forEach(b => {
    b.onclick = () => { showScreen(b.dataset.back); AudioSys.click(); };
  });
  
  document.getElementById('selectCarBtn').onclick = () => { showScreen('mainMenu'); };
  
  document.getElementById('pauseBtn').onclick = togglePause;
  document.getElementById('resumeBtn').onclick = () => { Game.state='playing'; showScreen(null); };
  document.getElementById('restartBtn').onclick = () => startGame();
  document.getElementById('mainMenuBtn').onclick = () => { Game.state='menu'; showScreen('mainMenu'); document.getElementById('hud').style.display='none'; document.getElementById('pauseBtn').style.display='none'; document.getElementById('mobileControls').style.display='none'; };
  document.getElementById('pauseGarageBtn').onclick = () => { buildGarage(); showScreen('garageScreen'); };
  document.getElementById('pauseSettingsBtn').onclick = () => showScreen('settingsScreen');
  
  document.getElementById('retryBtn').onclick = () => startGame();
  document.getElementById('goGarageBtn').onclick = () => { buildGarage(); showScreen('garageScreen'); };
  document.getElementById('goMainBtn').onclick = () => { Game.state='menu'; showScreen('mainMenu'); };
  
  // Settings toggles
  document.getElementById('musicToggle').onclick = function() {
    this.classList.toggle('on');
    Save.data.settings.music = this.classList.contains('on');
    Save.save();
  };
  document.getElementById('sfxToggle').onclick = function() {
    this.classList.toggle('on');
    Save.data.settings.sfx = this.classList.contains('on');
    Save.save();
  };
  document.getElementById('gfxSelect').value = Save.data.settings.gfx || 'medium';
  document.getElementById('gfxSelect').onchange = function() {
    Save.data.settings.gfx = this.value;
    Game.gfx = this.value;
    renderer.shadowMap.enabled = Game.gfx !== 'low';
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, Game.gfx === 'low' ? 1 : 1.5));
    Save.save();
  };
  document.getElementById('camSelect').value = Save.data.settings.camera || 0;
  document.getElementById('camSelect').onchange = function() {
    Save.data.settings.camera = parseInt(this.value);
    Save.save();
  };
  
  // Apply saved toggles
  if (!Save.data.settings.music) document.getElementById('musicToggle').classList.remove('on');
  if (!Save.data.settings.sfx) document.getElementById('sfxToggle').classList.remove('on');
}

// ==================== MAIN LOOP ====================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  Game.time += dt;
  
  if (Game.state === 'playing') {
    updatePhysics(dt);
    checkCollisions();
    updateWorld();
    updateParticles(dt);
    updateCamera(dt);
    updateHUD();
    
    // Coin spin
    coins.forEach(c => { if (c.mesh) c.mesh.rotation.z += dt * 4; });
    powerups.forEach(p => { if (p.mesh) { p.mesh.rotation.y += dt * 3; p.mesh.position.y = 1.5 + Math.sin(Game.time*4)*0.2; } });
  } else if (Game.state === 'menu' || Game.state === 'paused' || Game.state === 'gameover') {
    // Slow camera orbit for menu
    if (Game.state === 'menu') {
      camera.position.x = Math.sin(Game.time*0.2)*12;
      camera.position.z = Math.cos(Game.time*0.2)*12 + 5;
      camera.position.y = 6;
      camera.lookAt(0, 1, 0);
    }
  }
  
  renderer.render(scene, camera);
}

// ==================== INIT ====================
function init() {
  AudioSys.init();
  initThree();
  setupInput();
  setupUI();
  
  // Hide loading
  setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
    showScreen('mainMenu');
  }, 600);
  
  animate();
}

init();
})();
</script>
